# ─────────────────────────────────────────────────────────────────────────────
# CI
#
# PR 을 열면 자동으로 도는 검사입니다. 사람이 눈으로 하던 CONTRIBUTING.md 의
# 체크리스트를 기계가 대신 봅니다. 빨간불이 뜨면 아래 메시지를 읽고 고치면 됩니다.
#
# packages/ 아래를 훑어서 있는 것만 검사하므로, 새 패키지를 추가해도
# 이 파일을 고칠 필요가 없습니다. package.json 에 build / test 스크립트를
# 넣어두면 알아서 실행됩니다.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 연달아 push 하면 이전 실행은 취소합니다 (Actions 시간 절약).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. 위생 검사: 커밋하면 안 되는 것이 들어왔는지 ────────────────────────
  hygiene:
    name: 커밋 위생
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 브랜치 비교를 하려면 전체 히스토리가 필요합니다

      - name: 금지된 파일이 추적되고 있는지 확인
        run: |
          echo "추적 중인 파일에서 node_modules/, build/, dist/, .pptx, .thmx 를 찾습니다."
          # git ls-files = 실제로 레포에 커밋된 파일 목록. .gitignore 와 무관하게
          # 이미 추적 중인 파일은 여기 잡힙니다.
          #
          # core.quotePath=false 가 반드시 필요합니다. 기본값이면 git 이 한글 경로를
          # "\352\262\260..." 처럼 이스케이프해서 출력하는데, 그러면 끝이 따옴표가 되어
          # '\.pptx$' 같은 패턴이 빗나갑니다. 즉 '한글이름.pptx' 가 그냥 통과합니다.
          offenders=$(git -c core.quotePath=false ls-files | grep -E '(^|/)(node_modules|build|dist)/|\.(pptx|ppt|pptm|thmx|potx|pot)$' || true)
          if [ -n "$offenders" ]; then
            echo "::error::커밋하면 안 되는 파일이 레포에 들어와 있습니다."
            echo "$offenders" | sed 's/^/  /'
            {
              echo "### ❌ 금지된 파일이 커밋되어 있습니다"
              echo ''
              echo '```'
              echo "$offenders"
              echo '```'
              echo ''
              echo '고치는 법 — 파일은 디스크에 남기고 git 추적만 해제합니다:'
              echo ''
              echo '```bash'
              echo 'git rm -r --cached <경로>'
              echo 'git commit -m "chore: <경로> 추적 해제"'
              echo '```'
              echo ''
              echo '왜 막나요? CONTRIBUTING.md 1절을 읽어 주세요.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "OK — 금지된 파일 없음"

      - name: 레포 루트에 소스 파일을 두지 않았는지 확인
        run: |
          # CONTRIBUTING.md 2절: 소스는 packages/ 또는 examples/ 아래에만.
          # ':(top,glob)' 의 glob 매직이 중요합니다. 이게 없으면 '*' 가 '/' 까지
          # 먹어서 packages/ 안의 소스까지 전부 걸립니다.
          stray=$(git -c core.quotePath=false ls-files --full-name -- ':(top,glob)*.ts' ':(top,glob)*.js' ':(top,glob)*.mjs' ':(top,glob)*.py' || true)
          if [ -n "$stray" ]; then
            echo "::error::레포 루트에 소스 파일이 있습니다. packages/<이름>/ 아래로 옮겨 주세요."
            echo "$stray" | sed 's/^/  /'
            exit 1
          fi
          echo "OK — 루트에 흩어진 소스 없음"

      - name: 삭제된 파일 확인 (경고)
        if: github.event_name == 'pull_request'
        run: |
          # 실패시키지는 않습니다. 정당한 정리일 수도 있으니까요.
          # 다만 남의 작업을 지우는 사고가 실제로 있었기 때문에 눈에 띄게 알립니다.
          base="origin/${{ github.base_ref }}"
          deleted=$(git -c core.quotePath=false diff --diff-filter=D --name-only "$base"...HEAD || true)
          if [ -n "$deleted" ]; then
            echo "::warning::이 PR 은 파일을 삭제합니다. 의도한 게 맞는지 확인해 주세요."
            echo "$deleted" | sed 's/^/  /'
            {
              echo "### ⚠️ 이 PR 은 파일을 삭제합니다"
              echo ''
              echo '```'
              echo "$deleted"
              echo '```'
              echo ''
              echo '의도한 삭제라면 그대로 진행하세요. 기존 컴포넌트를 **대체**하려는 거라면'
              echo '지우지 말고 `packages/` 아래에 새로 추가한 뒤 이슈에서 논의해 주세요'
              echo '(CONTRIBUTING.md 4절).'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "OK — 삭제된 파일 없음"
          fi

  # ── 2. Node 패키지: 빌드 + 테스트 ────────────────────────────────────────
  node:
    name: Node 패키지 빌드·테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # mcp-server 의 계약 테스트가 진짜 bridge.py 를 실행해서 액션 목록을
      # 대조합니다. 그래서 이 잡에도 파이썬 의존성이 필요합니다.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 브릿지 의존성 설치 (계약 테스트용)
        run: pip install -r packages/ppt-bridge/requirements.txt

      - name: packages/*/package.json 을 찾아서 각각 빌드·테스트
        run: |
          set -u
          failed=0
          found=0

          for pkg in packages/*/; do
            [ -f "$pkg/package.json" ] || continue
            found=$((found + 1))
            name=$(basename "$pkg")
            echo ""
            echo "═══ $name ═══"

            # 락파일이 있으면 npm ci (재현 가능), 없으면 npm install.
            # 스캐폴드 단계의 패키지는 아직 락파일이 없을 수 있습니다.
            if [ -f "$pkg/package-lock.json" ]; then
              ( cd "$pkg" && npm ci ) || { echo "::error::$name: npm ci 실패"; failed=1; continue; }
            else
              echo "::warning::$name: package-lock.json 이 없어 npm install 로 진행합니다. 락파일을 커밋해 주세요 — 없으면 사람마다 다른 버전이 깔립니다."
              ( cd "$pkg" && npm install ) || { echo "::error::$name: npm install 실패"; failed=1; continue; }
            fi

            # build / test 스크립트가 있는 패키지만 실행합니다.
            if node -e "process.exit(require('./$pkg/package.json').scripts?.build ? 0 : 1)"; then
              ( cd "$pkg" && npm run build ) || { echo "::error::$name: 빌드 실패"; failed=1; }
            else
              echo "(build 스크립트 없음 — 건너뜀)"
            fi

            if node -e "process.exit(require('./$pkg/package.json').scripts?.test ? 0 : 1)"; then
              ( cd "$pkg" && npm test ) || { echo "::error::$name: 테스트 실패"; failed=1; }
            else
              echo "::warning::$name: test 스크립트가 없습니다. 테스트를 추가해 주세요."
            fi
          done

          echo ""
          echo "Node 패키지 $found 개 검사 완료"
          exit $failed

  # ── 3. Python 브릿지: 의존성 + 테스트 ────────────────────────────────────
  python:
    name: Python 브릿지 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'   # README 가 약속한 최소 버전으로 검사합니다

      - name: 의존성 설치
        working-directory: packages/ppt-bridge
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: import 확인
        # 여기서 깨지면 requirements.txt 가 실제로 필요한 걸 다 안 적은 겁니다.
        run: python -c "import pptx; print('python-pptx', pptx.__version__)"

      - name: 테스트
        working-directory: packages/ppt-bridge
        run: python -m pytest tests -v
